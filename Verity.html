<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verity: Emergency Response</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--ink:#0F1B2D;--mute:#5B6878;--card:#FFFFFF;--line:#E1E6EC;--red:#D62839;--amber:#C77700;--green:#12805C;--redbg:#FDECEE;--ambbg:#FFF2DC;--grnbg:#E1F4EC;--tab:#FFFFFF;
box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B141F;--ink:#EDF2F7;--mute:#9AABBB;--card:#142232;--line:#243649;--red:#FF6074;--amber:#F5B54E;--green:#4FD1A0;--redbg:#3A1822;--ambbg:#3A2B12;--grnbg:#10372B;--tab:#101C2A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B141F;--ink:#EDF2F7;--mute:#9AABBB;--card:#142232;--line:#243649;--red:#FF6074;--amber:#F5B54E;--green:#4FD1A0;--redbg:#3A1822;--ambbg:#3A2B12;--grnbg:#10372B;--tab:#101C2A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
h1{font-size:30px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.02em}
h2{font-size:15px;margin:22px 0 8px;color:var(--mute);font-weight:700}
p{margin:0}
.sub{color:var(--mute);margin-bottom:16px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;min-height:68px;font-weight:700}
.tile:active{transform:scale(.98)}
.ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--redbg)}
.ic.a{background:var(--ambbg)}
.field{display:flex;gap:8px;margin-top:4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}
.go{flex:none;background:var(--ink);color:var(--bg);font-weight:700;border-radius:12px;padding:0 18px}
.banner{border-radius:18px;padding:16px;margin:10px 0 14px}
.banner.crit{background:var(--redbg);border:1.5px solid var(--red)}
.banner.urg{background:var(--ambbg);border:1.5px solid var(--amber)}
.banner.mon{background:var(--grnbg);border:1.5px solid var(--green)}
.pill{display:inline-block;font-weight:700;font-size:14px;border-radius:99px;padding:3px 11px;color:#fff;background:var(--red)}
.urg .pill{background:var(--amber);color:#1b1200}
.banner h1{margin-top:10px;font-size:26px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--bg);border:1px solid var(--line)}
.step.now{border:2px solid var(--ink);font-size:19px}
.step.now .n{background:var(--ink);color:var(--bg)}
.step.done{opacity:.5}
.step.done .n{background:var(--green);color:#fff;border-color:var(--green)}
.step.done span{text-decoration:line-through}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.script{white-space:pre-wrap;font-size:15px;color:var(--mute);margin:8px 0 10px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font-weight:700;border-radius:14px;padding:14px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.red{background:var(--red);color:#fff;border:0;font-size:20px;padding:16px}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:15px}
.back{color:var(--mute);font-weight:700;padding:6px 0;margin-bottom:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--tab);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px)}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.bar .btn{flex:1}
.tabs .in button{flex:1;padding:8px;border-radius:12px;font-weight:700;color:var(--mute);display:grid;gap:2px;justify-items:center}
.tabs .in button.on{color:var(--ink);background:var(--bg)}
.tabs .in button span{font-size:20px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row a{flex:1;color:var(--ink);text-decoration:none;font-weight:700}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw input{width:24px;height:24px;flex:none;accent-color:var(--ink)}
.stk>*+*{margin-top:10px}
.foot{color:var(--mute);font-size:14px;margin-top:22px}
.loc{color:var(--mute);font-size:15px}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar"></div>

<script>
const CASES=[
{id:"choking",icon:"🫁",name:"Choking",sev:"crit",kw:{choke:3,choking:3,"cant breathe":2,"can't breathe":2,"cant talk":2,"can't talk":2,gagging:2,"stuck in throat":3},
 steps:["Ask “Are you choking?” If they can’t speak or cough, act now.","Stand behind them. Give 5 firm back blows between the shoulder blades.","Give 5 abdominal thrusts: fist above the navel, quick inward and upward pulls.","Alternate back blows and thrusts until the object comes out.","If they go limp, lower them to the floor and start CPR. Check the mouth for the object."]},
{id:"cardiac",icon:"❤️",name:"Heart attack or collapse",sev:"crit",kw:{"not breathing":4,unresponsive:4,"no pulse":4,collapsed:3,"chest pain":3,"chest tight":3,"heart attack":4,cardiac:4,"passed out":2,"arm pain":2,crushing:2,unconscious:3},
 steps:["Call 911 now and put the phone on speaker.","If unresponsive and not breathing normally, push hard and fast in the center of the chest. 100 to 120 per minute, about 2 inches deep.","Send someone for an AED. Turn it on and follow the voice prompts.","Do not stop until help arrives or they respond.","If awake with chest pain: sit them down, keep them calm, loosen tight clothing. If not allergic, they can chew one adult aspirin."]},
{id:"bleeding",icon:"🩸",name:"Severe bleeding",sev:"crit",kw:{bleeding:3,blood:2,bleed:3,cut:2,stabbed:4,gunshot:4,shot:3,laceration:2,"won't stop":2,gushing:3},
 steps:["Call 911 if blood is spurting, soaking through, or won’t stop.","Press directly on the wound with a clean cloth. Use both hands and lean your weight in.","Do not remove soaked cloth. Add more on top.","If a limb is bleeding badly and pressure fails, put a tourniquet 2 to 3 inches above the wound. Note the time.","Lay them down and raise the legs if no injury prevents it. Keep them warm."]},
{id:"stroke",icon:"🧠",name:"Possible stroke",sev:"crit",kw:{stroke:4,"face droop":4,drooping:3,slurred:3,slurring:3,"weak arm":3,numb:2,confused:2,"cant speak":2,"sudden headache":2},
 steps:["Call 911 now. Say “possible stroke.”","Check FAST: Face drooping, Arm weakness, Speech slurred, Time to call.","Write down the exact time symptoms started. Doctors need it.","Keep them sitting or lying with the head slightly raised. Give nothing to eat or drink.","Stay with them and watch their breathing."]},
{id:"allergy",icon:"🐝",name:"Allergic reaction",sev:"crit",kw:{allergic:3,anaphylaxis:4,swelling:2,hives:2,epipen:4,"throat closing":4,peanut:2,"bee sting":2,sting:1},
 steps:["Use an epinephrine auto-injector now if they have one. Outer thigh, hold 3 seconds.","Call 911 even if they improve.","Lay them flat with legs raised. If vomiting or struggling to breathe, let them sit up or lie on their side.","If symptoms continue, a second dose can be given after 5 to 15 minutes.","Be ready to start CPR if they stop breathing."]},
{id:"overdose",icon:"💊",name:"Overdose or poisoning",sev:"crit",kw:{overdose:4,overdosed:4,pills:2,poison:4,"too many":2,opioid:3,fentanyl:3,narcan:4,bleach:3},
 steps:["Call 911, or Poison Control at 1-800-222-1222.","If opioids are suspected and you have naloxone (Narcan), give it now.","Keep them awake if possible. If unconscious, roll them onto their side.","Do not make them vomit.","Keep the container or pill bottle for responders."]},
{id:"seizure",icon:"⚡",name:"Seizure",sev:"urg",kw:{seizure:4,seizing:4,convulsing:4,shaking:2,epilep:3},
 steps:["Note the time. Clear hard objects away from them.","Do not hold them down. Never put anything in their mouth.","Cushion their head. Turn them on their side once shaking stops.","Call 911 if it lasts over 5 minutes, repeats, they are hurt, pregnant, or do not wake up.","Stay until they are fully alert."]},
{id:"burn",icon:"🔥",name:"Burn",sev:"urg",kw:{burn:3,burned:3,scald:3,fire:2,boiling:2,chemical:2},
 steps:["Move away from the heat source.","Cool the burn under cool running water for 10 to 20 minutes. No ice.","Take off rings and tight items near the burn before it swells.","Cover loosely with a clean non-stick dressing.","Call 911 for burns on the face, hands, or genitals, larger than a palm, or any chemical or electrical burn."]},
{id:"injury",icon:"🦴",name:"Fall or broken bone",sev:"urg",kw:{broken:3,fracture:3,fell:2,fall:2,"hit head":3,"head injury":3,bone:2,deformed:3,concussion:3,sprain:1},
 steps:["Do not move them if a neck, back, or head injury is possible.","Keep the injured part still. Only splint in the position you found it.","Hold a cold pack wrapped in cloth on it for 20 minutes.","Call 911 for passing out, vomiting, confusion, or a bone through the skin.","Watch for worsening drowsiness or headache."]},
{id:"asthma",icon:"😮‍💨",name:"Hard to breathe",sev:"urg",kw:{asthma:4,wheezing:3,"short of breath":3,"breathing hard":3,inhaler:3,"cant catch":3},
 steps:["Sit them upright. Stay calm and speak slowly.","Help them use their rescue inhaler: 1 puff every 30 to 60 seconds, up to 10 puffs.","Loosen tight clothing and open a window.","Call 911 if lips turn blue, they can’t speak a full sentence, or the inhaler does not help.","Stay with them until breathing is normal."]}
];
const BOOST={"not breathing":2,unresponsive:2,unconscious:2,"won't wake":2,"wont wake":2,blue:1,gushing:1,severe:1,baby:1,infant:1,pregnant:1};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={name:"",notes:"",shareLoc:true,theme:"auto"},contacts=[],loc=null,cur=null,done=[],view="home";
try{S=Object.assign(S,JSON.parse(localStorage.getItem("v_s")||"{}"));contacts=JSON.parse(localStorage.getItem("v_c")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("v_s",JSON.stringify(S));localStorage.setItem("v_c",JSON.stringify(contacts))}catch(e){}};
function theme(){const d=document.documentElement;if(S.theme==="auto")d.removeAttribute("data-theme");else d.dataset.theme=S.theme}

function triage(text){
  const t=text.toLowerCase().replace(/[’]/g,"'");let best=null,bs=0,boost=0;
  CASES.forEach(c=>{let s=0;for(const k in c.kw)if(t.includes(k))s+=c.kw[k];if(s>bs){bs=s;best=c}});
  for(const k in BOOST)if(t.includes(k))boost+=BOOST[k];
  return{c:best,score:bs,boost}
}
function getLoc(cb){
  if(!S.shareLoc||!navigator.geolocation){cb&&cb(false);return}
  navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};cb&&cb(true)},()=>{cb&&cb(false)},{enableHighAccuracy:true,timeout:8000,maximumAge:60000})
}
function script(){
  const w=loc?"Location: "+loc.lat.toFixed(5)+", "+loc.lon.toFixed(5)+" (within "+Math.round(loc.acc)+" m)":"Location: not available, give your street address";
  let s="I need an ambulance.\nEmergency: "+cur.c.name+(cur.text?"\nDetails: "+cur.text:"")+"\n"+w;
  if(S.name)s+="\nPatient: "+S.name;if(S.notes)s+="\nMedical info: "+S.notes;
  return s+"\nI will stay on the line."
}

function home(){
  view="home";
  $("#app").innerHTML=`<h1>What’s the problem?</h1><p class="sub">Tap the closest match, or describe it below.</p>
  <div class="grid">${CASES.map(c=>`<button class="tile" data-id="${c.id}"><span class="ic ${c.sev==="urg"?"a":""}">${c.icon}</span>${c.name}</button>`).join("")}</div>
  <h2>Or describe it</h2>
  <div class="field"><input id="q" placeholder="e.g. my dad has chest pain" aria-label="Describe the emergency"><button class="go" id="go">Go</button></div>
  <p id="msg" class="loc" style="margin-top:8px" aria-live="polite"></p>
  <p class="foot">Verity gives general first aid guidance. It does not replace 911 or a medical professional. If anyone may be in danger, call 911 first.</p>`;
  document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>open(CASES.find(c=>c.id===b.dataset.id),"",b.dataset.id==="x"));
  const run=()=>{const t=$("#q").value.trim();if(!t){$("#msg").textContent="Type what’s happening first.";return}
    const r=triage(t);if(!r.c){$("#msg").textContent="No match. If anyone is unconscious or not breathing, call 911 now. Otherwise add more detail or pick a tile.";return}
    open(r.c,t,r.score>=6||r.boost>=2)};
  $("#go").onclick=run;$("#q").onkeydown=e=>{if(e.key==="Enter")run()};
  bar();
}
function open(c,text,up){
  cur={c,text,sev:(c.sev==="urg"&&up)?"crit":c.sev};done=[];view="guide";getLoc(()=>{if(view==="guide")paintShare()});guide();
}
function guide(){
  const lbl={crit:"Call 911 now",urg:"Call 911 if it gets worse"}[cur.sev];
  const first=done.indexOf(false)<0?cur.c.steps.findIndex((s,i)=>!done[i]):0;
  const now=cur.c.steps.findIndex((s,i)=>!done[i]);
  $("#app").innerHTML=`<button class="back" id="back">‹ Back</button>
  <div class="banner ${cur.sev}"><span class="pill">${cur.sev==="crit"?"Critical":"Urgent"}</span><h1>${cur.c.name}</h1><p><b>${lbl}</b></p></div>
  <h2>Do this now. Tap each step when done.</h2>
  <ol class="steps">${cur.c.steps.map((s,i)=>`<li><button class="step ${done[i]?"done":i===now?"now":""}" data-i="${i}"><span class="n">${done[i]?"✓":i+1}</span><span>${s}</span></button></li>`).join("")}</ol>
  <h2>Tell the dispatcher</h2>
  <div class="card"><div id="share"></div></div>`;
  $("#back").onclick=home;
  document.querySelectorAll(".step").forEach(b=>b.onclick=()=>{done[+b.dataset.i]=!done[+b.dataset.i];const y=scrollY;guide();scrollTo(0,y)});
  paintShare();bar();
}
function paintShare(){
  const el=$("#share");if(!el||!cur)return;
  const q=loc?loc.lat+","+loc.lon:"";
  el.innerHTML=`<div class="script">${esc(script())}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="cp">Copy</button>
  ${loc?`<a class="btn sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/emergency+room/@${q},14z">Nearest ER</a>`:`<button class="btn sm" id="gl">Share location</button>`}</div>`;
  $("#cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(script()).then(()=>{$("#cp").textContent="Copied"}).catch(()=>{})};
  const g=$("#gl");if(g)g.onclick=()=>{S.shareLoc=true;save();g.textContent="Finding...";getLoc(()=>paintShare())};
}
function bar(){
  const b=$("#bar");
  if(view==="guide"){
    const nums=contacts.map(c=>c.p.replace(/[^\d+]/g,"")).join(",");
    const body=encodeURIComponent("I need help. "+(S.name?S.name+": ":"")+cur.c.name+". "+(loc?"https://www.google.com/maps?q="+loc.lat+","+loc.lon:""));
    b.innerHTML=`<div class="bar"><div class="in"><a class="btn red" href="tel:911">Call 911</a>${nums?`<a class="btn" style="flex:.6;display:grid;place-items:center" href="sms:${nums}?&body=${body}">Text contacts</a>`:""}</div></div>`;
  }else{
    b.innerHTML=`<div class="bar tabs"><div class="in"><button class="${view==="home"?"on":""}" id="t1"><span>🚑</span>Help</button><button class="${view==="settings"?"on":""}" id="t2"><span>⚙️</span>Settings</button><a class="btn" style="flex:.9;display:grid;place-items:center;background:var(--red);color:#fff;border:0" href="tel:911">Call 911</a></div></div>`;
    $("#t1").onclick=home;$("#t2").onclick=settings;
  }
}
function settings(){
  view="settings";
  $("#app").innerHTML=`<h1>Settings</h1><p class="sub">Saved only on this device.</p>
  <h2>About you (shared with dispatcher)</h2><div class="card stk">
  <input id="nm" placeholder="Your name" value="${esc(S.name)}" aria-label="Your name">
  <textarea id="nt" rows="2" placeholder="Allergies, conditions, medications" aria-label="Medical info">${esc(S.notes)}</textarea></div>
  <h2>Emergency contacts</h2><div class="card"><div id="cl"></div>
  <div class="field" style="flex-wrap:wrap"><input id="cn" placeholder="Name" style="flex:1 1 120px" aria-label="Contact name"><input id="cph" placeholder="Phone" inputmode="tel" style="flex:1 1 120px" aria-label="Contact phone"><button class="go" id="add" style="padding:12px 18px">Add</button></div></div>
  <h2>Location</h2><div class="card stk"><label class="sw"><span><b>Include my location</b><br><span class="loc">Used in the dispatcher script and nearest ER link.</span></span><input type="checkbox" id="sl" ${S.shareLoc?"checked":""}></label>
  <p class="loc" id="ls">${loc?"Located, within "+Math.round(loc.acc)+" m.":"Not located yet."}</p><button class="btn sm" id="fl">Test location</button></div>
  <h2>Appearance</h2><div class="seg" id="th">${["auto","light","dark"].map(t=>`<button data-t="${t}" class="${S.theme===t?"on":""}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>
  <h2>Data</h2><button class="btn" id="clr">Clear all saved data</button>`;
  const upd=()=>{S.name=$("#nm").value.trim();S.notes=$("#nt").value.trim();save()};
  $("#nm").oninput=upd;$("#nt").oninput=upd;
  $("#sl").onchange=e=>{S.shareLoc=e.target.checked;save()};
  $("#fl").onclick=()=>{$("#ls").textContent="Finding...";const was=S.shareLoc;S.shareLoc=true;getLoc(ok=>{S.shareLoc=was;$("#ls").textContent=ok?"Located, within "+Math.round(loc.acc)+" m.":"Could not get location. Allow it in browser settings."})};
  document.querySelectorAll("#th button").forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;save();theme();settings()});
  $("#add").onclick=()=>{const n=$("#cn").value.trim(),p=$("#cph").value.trim();if(!n||!p)return;contacts.push({n,p});save();settings()};
  $("#clr").onclick=()=>{if(confirm("Clear everything saved in Verity?")){S={name:"",notes:"",shareLoc:true,theme:"auto"};contacts=[];save();theme();settings()}};
  $("#cl").innerHTML=contacts.length?contacts.map((c,i)=>`<div class="row"><a href="tel:${esc(c.p)}">${esc(c.n)}<br><span class="loc">${esc(c.p)}</span></a><button class="btn sm" data-i="${i}" aria-label="Remove ${esc(c.n)}">Remove</button></div>`).join(""):'<p class="loc" style="margin-bottom:10px">No contacts yet.</p>';
  document.querySelectorAll("#cl button").forEach(b=>b.onclick=()=>{contacts.splice(+b.dataset.i,1);save();settings()});
  bar();
}
theme();home();
</script>
</body>
</html>
